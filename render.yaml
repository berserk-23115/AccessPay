# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: accesspay-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accesspay-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: MERCHANT_API_KEY
        generateValue: true

databases:
  - name: accesspay-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: accesspay
    user: accesspay
    ipAllowList: []
